services:
  bff-interpreter:
    image: ghcr.io/applied-tape-mechanics/bff-interpreter:latest
    build:
      context: .
      target: runner
    container_name: bff-interpreter-runner
    restart: "no"

  test:
    build:
      context: .
      target: test
    container_name: bff-interpreter-test
    profiles:
      - test
    command: npm test
